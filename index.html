<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Potato Gate</title>
<style>
  body{font-family:system-ui,sans-serif;background:#161616;color:#eee;max-width:560px;margin:0 auto;padding:24px}
  h1{margin-bottom:4px} input,button{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #444;background:#222;color:#eee;font-size:16px;box-sizing:border-box}
  button{background:#e0a030;color:#000;border:0;font-weight:700;cursor:pointer}
  .note{color:#999;font-size:14px} .entry{border-bottom:1px solid #333;padding:8px 0}
  #welcome{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;flex-direction:column}
  #welcome video{max-width:90%;max-height:70%} #welcome button{width:auto;margin-top:12px}
</style>
</head>
<body>
<div style="font-size:48px">🥔</div>
<h1>The Potato Gate</h1>
<p class="note">Enter your email, then write anything under «Картошка». Whoever has the access code can see everyone who signed.</p>

<input id="email" type="email" placeholder="Email address">
<input id="potato" placeholder="Картошка — write whatever you like">
<button id="enter">Enter</button>
<p id="msg" class="note"></p>

<h2>Public log</h2>
<div id="log" class="note">🔒 Locked. Enter the access code below to see who signed.</div>

<input id="code" type="password" placeholder="Access code">
<button id="unlock">Unlock</button>

<div id="welcome">
  <video src="welcome.mp4" controls autoplay playsinline></video>
  <button id="close">Close ×</button>
</div>

<script>
const $ = id => document.getElementById(id);
async function api(data){
  const r = await fetch("/api/gate",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(data)});
  return {ok:r.ok, data: await r.json().catch(()=>({}))};
}
$("enter").onclick = async () => {
  const {ok,data} = await api({action:"sign",email:$("email").value,potato:$("potato").value});
  if(ok){ $("msg").textContent=""; $("welcome").style.display="flex"; $("email").value=""; $("potato").value=""; }
  else $("msg").textContent = "Error: check your email and text.";
};
$("close").onclick = () => { $("welcome").style.display="none"; $("welcome").querySelector("video").pause(); };
$("unlock").onclick = async () => {
  const {ok,data} = await api({action:"unlock",code:$("code").value});
  const log = $("log");
  if(!ok){ log.textContent = "Wrong code."; return; }
  log.textContent = "";
  if(!data.entries.length) log.textContent = "No entries yet.";
  data.entries.forEach(e => {
    const d = document.createElement("div"); d.className="entry";
    d.textContent = e.email + " — " + e.potato;
    log.appendChild(d);
  });
};
</script>
</body>
</html>
